<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="viewport-fit=cover,width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RENNX - 2D RPG ADVENTURE</title><link rel="stylesheet" href="style.css"></head>
<body><div id="game">
<canvas id="c" width="960" height="540"></canvas>
<div id="ptag" class="box" data-a="sw">
<div class="portrait"><canvas id="pface" width="96" height="96"></canvas></div>
<div class="pinfo"><div class="pn"><b id="pname"></b> <span id="plv"></span></div>
<div class="bar hpb"><i id="hp"></i><span id="hpt"></span></div>
<div class="bar mpb"><i id="mp"></i><span id="mpt"></span></div>
<div class="bar xpb"><i id="xp"></i><span id="xpt"></span></div></div></div>
<div id="qt" class="box"></div>
<div id="menu">
<button class="mb" data-a="op" data-v="inv"><i data-ic="bag"></i><span>Inventory</span></button>
<button class="mb" data-a="op" data-v="char"><i data-ic="person"></i><span>Character</span></button>
<button class="mb" data-a="op" data-v="quest"><i data-ic="scroll"></i><span>Quest</span><s id="qdot" class="hide"></s></button>
</div>
<button id="pausebtn" class="mb" data-a="op" data-v="menu"><i data-ic="pause"></i></button>
<div id="gold" class="box"><i data-ic="coin"></i><b id="goldv">0</b></div>
<canvas id="mm" class="box" data-a="op" data-v="map" width="160" height="90"></canvas>
<div id="joy"><svg viewBox="0 0 100 100"><path d="M50 7l7 9H43zM50 93l7-9H43zM7 50l9-7v14zM93 50l-9-7v14z" fill="rgba(255,255,255,.65)"/></svg><i id="knob"></i></div>
<div id="skills"></div>
<div id="ind" class="hide"><div id="indi"></div><b id="indl"></b></div>
<div id="toast"></div><div id="banner"></div>
<div id="dlg" class="box hide"></div>
<div id="panel" class="box hide"><button id="x" data-a="x" data-ic="close"></button><div id="pc"></div></div>
<div id="title"><h1>RENNX</h1><h2>2D RPG ADVENTURE</h2>
<button data-a="start">Game Baru</button><button data-a="cont" id="cont">Lanjutkan</button>
<p>WASD gerak · Space serang · 1/2/3 skill · Q/R ultimate · E interaksi · I/J/M/C panel · T ganti karakter</p></div>
<div id="fmap" class="hide"><div id="fmbox" class="box"><div id="fmh"><b>Peta Dunia</b><small>Geser untuk menggeser · cubit/scroll untuk zoom</small><button id="fmx" data-a="x" data-ic="close"></button></div>
<div id="fmw"><canvas id="fmc"></canvas><div id="fmar"></div>
<div id="fmleg"><span class="lg p"></span>Kamu <span class="lg n"></span>NPC <span class="lg q">!</span>Quest <span class="lg s">$</span>Shop <span class="lg e"></span>Monster <span class="lg b"></span>Boss <span class="lg c"></span>Chest <span class="lg v"></span>Area kamera</div>
<div id="fmctl"><button id="fmcen" title="Center Player"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="#2a7bff" stroke="#fff" stroke-width="1.6"/><circle cx="12" cy="12" r="9" fill="none" stroke="#f0e0c0" stroke-width="2"/><path d="M12 1v5M12 18v5M1 12h5M18 12h5" stroke="#f0e0c0" stroke-width="2"/></svg></button><button id="fmm">&minus;</button><button id="fmp">+</button></div></div></div></div>
<div id="rot"><div><div style="font-size:5em">↻</div><b>Please rotate your device</b><br>Landscape Mode Required</div></div>
<script src="script.js"></script></body></html>
