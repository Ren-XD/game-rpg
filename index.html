<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="viewport-fit=cover,width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RENNX - 2D RPG ADVENTURE</title><link rel="stylesheet" href="style.css"></head>
<body><div id="game">
<canvas id="c" width="960" height="540"></canvas>
<div id="ptag" class="box"><b id="pname"></b> <span id="plv"></span> <button data-a="sw">⇄ Switch</button>
<div class="bar"><i id="hp" style="background:#d33"></i><span id="hpt"></span></div>
<div class="bar"><i id="mp" style="background:#37f"></i><span id="mpt"></span></div>
<div class="bar"><i id="xp" style="background:#e8c13a"></i><span id="xpt"></span></div></div>
<div id="qt" class="box"></div>
<div id="top"><div id="gold" class="box"></div><br>
<button data-a="op" data-v="inv">🎒 Inventory</button><button data-a="op" data-v="quest">📜 Quest</button><button data-a="op" data-v="char">🧙 Character</button><button data-a="op" data-v="shop">🛒 Shop</button><button data-a="op" data-v="map">🗺️ Map</button><button data-a="op" data-v="menu">⏸</button></div>
<canvas id="mm" class="box" width="120" height="72"></canvas>
<div id="joy"><i id="knob"></i></div>
<div id="skills"></div>
<div id="ind" class="hide"><div id="indi"></div><b id="indl"></b></div>
<div id="toast"></div><div id="banner"></div>
<div id="dlg" class="box hide"></div>
<div id="panel" class="box hide"><button id="x" data-a="x">✕</button><div id="pc"></div></div>
<div id="title"><h1>RENNX</h1><h2>2D RPG ADVENTURE</h2>
<button data-a="start">⚔️ Game Baru</button><button data-a="cont" id="cont">📂 Lanjutkan</button>
<p>WASD gerak · Space serang · 1/2/3 skill · Q/R ultimate · E interaksi · I/J/M/C panel · T ganti karakter</p></div>
<div id="rot"><div><div style="font-size:5em">↻</div><b>Please rotate your device</b><br>Landscape Mode Required</div></div>
<script src="script.js"></script></body></html>
